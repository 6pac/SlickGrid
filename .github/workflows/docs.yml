# SlickGrid documentation — build & deploy to GitHub Pages.
#
# It:
#   1. regenerates the API reference from src/ (npm run api),
#   2. runs the drift gate (fails on NEW undocumented public API),
#   3. builds the VitePress site with the correct base path,
#   4. publishes it to GitHub Pages from the release branches.
#
# Set the base path to match the Pages URL. For a project site served at
# https://6pac.github.io/SlickGrid/ the base is /SlickGrid/.

name: Docs
on:
  push:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'vitepress/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitepress
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Regenerate API reference from source
        run: npm run api
      - name: Drift gate (fail on new undocumented public API)
        run: npm run drift -- --strict
      - name: Build site
        env:
          DOCS_BASE: /SlickGrid/
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: vitepress/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next-v6'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
