<!doctype html>
<!--
  TEMPORARY repro page for the frozen-bottom cell-cleanup bug (triage Q1).
  DO NOT MERGE — this page exists only to drive the repro cypress test and to let a
  human see the leak; delete it at merge. The permanent regression test is
  cypress/e2e/quirk-frozen-bottom-cell-cleanup.cy.ts.

  Bug: in frozenBottom mode, cleanUpCells() exempted EVERY row from horizontal cell
  cleanup (its top-band disjunct lacked !frozenBottom), so scrolling horizontally
  accumulated cell DOM nodes without bound. This grid has 40 narrow columns in a
  narrow viewport (heavy horizontal virtualization) so the leak is easy to observe.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SlickGrid quirk repro: frozen-bottom cell cleanup (Q1)</title>
  <link rel="stylesheet" href="../dist/styles/css/example-demo.css" type="text/css"/>
  <link rel="stylesheet" href="../dist/styles/css/slick-alpine-theme.css" type="text/css"/>
  <style> h3 { margin: 14px 0 4px 0; } </style>
</head>
<body>
<h2>Q1 — frozen-bottom cell cleanup (TEMPORARY repro, do not merge)</h2>
<div style="width:700px;">
  <p>40 columns / narrow viewport / <code>frozenRow: 2, frozenBottom: true</code>.
     The self-check scrolls right &amp; back and asserts a scrollable row's rendered
     cell count stays bounded (buggy build: it balloons toward 40).</p>
  <div id="myGrid" style="width:100%;height:360px;"></div>
  <button onclick="runChecks()">Run cell-cleanup self-checks</button>
  <div id="checkResults" style="white-space:pre; font-family:monospace; font-size:12px; margin-top:8px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs/Sortable.min.js"></script>
<script src="sortable-cdn-fallback.js"></script>

<script src="../dist/browser/slick.core.js"></script>
<script src="../dist/browser/slick.interactions.js"></script>
<script src="../dist/browser/slick.grid.js"></script>

<script>
  var COLS = 40, ROWS = 30;
  var columns = [];
  for (var c = 0; c < COLS; c++) {
    columns.push({ id: 'c' + c, name: 'Col ' + c, field: 'c' + c, width: 100 });
  }
  var data = [];
  for (var r = 0; r < ROWS; r++) {
    var row = {};
    for (var c2 = 0; c2 < COLS; c2++) { row['c' + c2] = 'r' + r + 'c' + c2; }
    data.push(row);
  }
  var grid = new Slick.Grid('#myGrid', data, columns, {
    enableCellNavigation: true,
    enableColumnReorder: false,
    frozenRow: 2,
    frozenBottom: true,
    rowHeight: 25
  });
  window.grid = grid;
  window.COLS = COLS;

  // rendered .slick-cell count of a SCROLLABLE row (row 3; actualFrozenRow is 28,
  // so 3 is scrollable). The leak accumulates cells here because cleanUpCells never
  // runs in the buggy frozenBottom path. The frozen bottom rows are deliberately
  // exempt from horizontal cleanup in BOTH buggy and fixed code, so they must NOT
  // be measured — hence a specific scrollable row via its data-row attribute.
  function scrollableRowCells() {
    var el = document.querySelector('#myGrid .slick-row[data-row="3"]');
    return el ? el.querySelectorAll('.slick-cell').length : -1;
  }
  function scrollRoundTrip() {
    // drive horizontal scrolling through the grid's own API so real render +
    // cleanUpCells passes run (a synthetic scrollLeft + 'scroll' event does not
    // reliably drive SlickGrid's scroll render). Row 3 is scrollable.
    for (var k = 0; k < 3; k++) {
      grid.scrollCellIntoView(3, COLS - 1); grid.render();  // far right
      grid.scrollCellIntoView(3, 0);        grid.render();  // back to far left
    }
  }
  window.runChecks = function runChecks() {
    var out = [], pass = true;
    function check(label, ok, detail) {
      out.push((ok ? 'PASS ' : 'FAIL ') + label + (detail ? '  [' + detail + ']' : ''));
      if (!ok) { pass = false; }
    }
    var baseCells = scrollableRowCells();
    check('scrollable row 3 renders a virtualized subset (some cells, fewer than all columns)',
      baseCells > 0 && baseCells < COLS, 'baseline cells=' + baseCells + ' of ' + COLS);
    scrollRoundTrip();
    var afterCells = scrollableRowCells();
    check('scrollable row 3 off-screen cells are cleaned after horizontal scrolling (no leak)',
      afterCells > 0 && afterCells < COLS / 2, 'cells=' + afterCells + ' of ' + COLS);
    out.push(pass ? '\nALL CHECKS PASSED' : '\nCHECKS FAILED');
    document.getElementById('checkResults').textContent = out.join('\n');
    return pass;
  };
</script>
</body>
</html>
