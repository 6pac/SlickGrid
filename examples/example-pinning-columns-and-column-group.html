<!DOCTYPE HTML>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <link rel="shortcut icon" type="image/ico" href="favicon.ico" />
  <link rel="stylesheet" href="../dist/styles/css/slick.columnpicker.css" type="text/css"/>
  <link rel="stylesheet" href="../dist/styles/css/slick.gridmenu.css" type="text/css"/>
  <link rel="stylesheet" href="../dist/styles/css/example-demo.css" type="text/css"/>
  <link rel="stylesheet" href="../dist/styles/css/slick-alpine-theme.css" type="text/css"/>
  <link rel="stylesheet" href="../dist/styles/css/slick-icons.css" type="text/css"/>
  <style>
    .slick-preheader-panel.slick-state-default  {
      width: 100%;
      overflow: hidden;
      border-left: 0px !important;
      border-bottom: 0px !important;
    }
    .slick-preheader-panel.slick-state-default.slick-header {
      border-bottom: 0px !important;
    }

    .slick-preheader-panel .slick-header-columns,
    .slick-preheader-panel .slick-header-column {
      background-color: inherit;
      border-bottom: 0px !important;
    }
  </style>
</head>
<body>
<h2 class="title">Example - Pinned Columns & Column Group</h2>
<div style="position:relative">
  <div style="width:600px;">
    <div id="myGrid" class="slick-container" style="width:100%;height:500px;"></div>
  </div>

  <div class="options-panel">
    <h2>
      <a href="/examples/index.html" style="text-decoration: none; font-size: 22px">&#x2302;</a>
      Demonstrates:
    </h2>
    <ul>
      <li>Pinned columns with an extra header row grouping columns into categories</li>
    </ul>
    <div style="margin-bottom:10px">
      <button data-test="remove-pinned-btn" onclick="setPinnedColumns(-1)">Remove Pinned Columns</button>
      <button data-test="set-pinned-btn" onclick="setPinnedColumns(2)">Set 3 Pinned Columns</button>
    </div>

      <h2>View Source:</h2>
      <ul>
          <li><A href="https://github.com/6pac/SlickGrid/blob/master/examples/example-pinning-columns-and-column-group.html" target="_sourcewindow"> View the source for this example on Github</a></li>
      </ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs/Sortable.min.js"></script>

<script src="../dist/browser/slick.core.js"></script>
<script src="../dist/browser/slick.interactions.js"></script>
<script src="../dist/browser/slick.grid.js"></script>
<script src="../dist/browser/slick.dataview.js"></script>
<script src="../dist/browser/controls/slick.columnpicker.js"></script>
<script src="../dist/browser/controls/slick.gridmenu.js"></script>

<script>
  function CreateAddlHeaderRow() {
    // Pinning uses one shared pre-header panel, so render the complete group row once.
    const preHeaderPanelElm = grid.getPreHeaderPanel();
    renderHeaderGroups(preHeaderPanelElm, 0, grid.getColumns().length);

    function renderHeaderGroups(preHeaderPanel, start, end) {
      preHeaderPanel.innerHTML = '';
      preHeaderPanel.classList.add("slick-header-columns");
      preHeaderPanel.style.left = '0px';
      preHeaderPanel.style.width = `${grid.getHeadersWidth()}px`;
      preHeaderPanel.parentElement.classList.add("slick-header");
      preHeaderPanel.style.backgroundColor = getComputedStyle(grid.getHeaderColumn(0)).backgroundColor || '#ececec';

      let headerColumnWidthDiff = grid.getHeaderColumnWidthDiff();
      let m, header, lastColumnGroup = '', widthTotal = 0;
      const columns = grid.getColumns();

      for (let i = start; i < end; i++) {
        m = columns[i];
        if (m && !m.hidden) {
          if (lastColumnGroup === m.columnGroup && i>start) {
            widthTotal += m.width;
            header.style.width = `${widthTotal - headerColumnWidthDiff}px`;
            header.dataset.groupEnd = String(i);
          } else {
              widthTotal = m.width;
              header = document.createElement('div');
              header.className = 'ui-state-default slick-header-column';
              header.innerHTML = `<span class="slick-column-name">${(m.columnGroup || '')}</span>`;
              header.style.width = `${m.width - headerColumnWidthDiff}px`;
              header.dataset.groupStart = String(i);
              header.dataset.groupEnd = String(i);
              preHeaderPanel.appendChild(header);
          }
          lastColumnGroup = m.columnGroup;
        }
      }
    }

    syncPinnedGroupHeaders();
  }

  let groupHeaderScrollLeft = 0;

  function syncPinnedGroupHeaders(scrollLeft) {
    if (scrollLeft !== undefined) {
      groupHeaderScrollLeft = scrollLeft;
    }

    const preHeaderPanelElm = grid.getPreHeaderPanel();
    const leftBoundary = grid.getOptions().pinning?.columns?.left;
    const pinnedColumnBoundary = typeof leftBoundary === 'number' ? leftBoundary : -1;
    let pinnedLeftWidth = 0;

    if (pinnedColumnBoundary >= 0) {
      for (let i = 0; i <= pinnedColumnBoundary; i++) {
        const column = grid.getColumns()[i];
        if (!column?.hidden) {
          pinnedLeftWidth += grid.getHeaderColumn(i)?.offsetWidth || 0;
        }
      }
    }

    let pinnedMask = preHeaderPanelElm.querySelector('.slick-preheader-pinned-left-mask');
    if (pinnedLeftWidth > 0) {
      if (!pinnedMask) {
        pinnedMask = document.createElement('div');
        pinnedMask.className = 'slick-preheader-pinned-left-mask';
        pinnedMask.style.position = 'absolute';
        pinnedMask.style.left = '0';
        pinnedMask.style.top = '0';
        pinnedMask.style.bottom = '0';
        pinnedMask.style.zIndex = '1';
        pinnedMask.style.pointerEvents = 'none';
        preHeaderPanelElm.appendChild(pinnedMask);
      }
      pinnedMask.style.width = `${pinnedLeftWidth}px`;
      // The pre-header panel can be transparent in the base/default theme.
      // Use the rendered header background so scrolling group titles remain
      // behind the pinned group area.
      pinnedMask.style.backgroundColor = getComputedStyle(grid.getHeaderColumn(0)).backgroundColor || '#ececec';
      pinnedMask.style.transform = `translateX(${groupHeaderScrollLeft}px)`;
    } else {
      pinnedMask?.remove();
    }

    preHeaderPanelElm.querySelectorAll('[data-group-start]').forEach((groupHeader) => {
      const groupEnd = Number(groupHeader.dataset.groupEnd);
      const isPinnedLeft = pinnedColumnBoundary >= 0 && groupEnd <= pinnedColumnBoundary;
      groupHeader.style.zIndex = isPinnedLeft ? '2' : '';
      groupHeader.style.transform = isPinnedLeft ? `translateX(${groupHeaderScrollLeft}px)` : '';
    });
  }

  function setPinnedColumns(pinBoundary) {
    grid.setOptions({ pinning: { columns: { left: pinBoundary >= 0 ? pinBoundary : [] } } });
    options = grid.getOptions();
    CreateAddlHeaderRow();
  }

  function pickerHeaderColumnValueExtractor(column) {
    let headerGroup = column.columnGroup || '';
    if (headerGroup) {
      return headerGroup + ' - ' + column.name;
    }
    return column.name;
  }

  let dataView;
  let grid;
  let data = [];
  let columnpicker;
  let gridMenuControl;
  let options = {
    enableCellNavigation: true,
    enableColumnReorder: false,
    createPreHeaderPanel: true,
    showPreHeaderPanel: true,
    preHeaderPanelHeight: 23,
    explicitInitialization: true,
    pinning: { columns: { left: 2 } },

    // if you wish to include the columnGroup as part of the pickers, you can do so with following code
    columnPicker: {
      headerColumnValueExtractor: pickerHeaderColumnValueExtractor
    },
    gridMenu: {
      // iconButtonContainer: 'preheader', // we can display the grid menu icon in either the preheader or in the column header (default)
      iconCssClass: "sgi sgi-menu sgi-17px",
      headerColumnValueExtractor: pickerHeaderColumnValueExtractor,
      customTitle: "Commands",
      columnTitle: "Columns",
      customItems: [
        {
          iconCssClass: "sgi sgi-close",
          title: "Clear Pinned Columns",
          disabled: false,
          command: "clear-pinned-columns",
          cssClass: 'bold',     // container css class
          textCssClass: 'red'   // just the text css class
        }
      ]
    },
  };
  let columns = [
    {id: "sel", name: "#", field: "num", behavior: "select", cssClass: "cell-selection", width: 40, resizable: false, selectable: false },
    {id: "title", name: "Title", field: "title", width: 120, minWidth: 120, cssClass: "cell-title", columnGroup:"Common Factor"},
    {id: "duration", name: "Duration", field: "duration", columnGroup:"Common Factor"},
    {id: "start", name: "Start", field: "start", minWidth: 140, columnGroup:"Period"},
    {id: "finish", name: "Finish", field: "finish", minWidth: 140, columnGroup:"Period"},
    {id: "%", defaultSortAsc: false, name: "% Complete", field: "percentComplete", width: 140, resizable: false, columnGroup:"Analysis"},
    {id: "effort-driven", name: "Effort Driven", width: 140, minWidth: 20, maxWidth: 140, field: "effortDriven", columnGroup:"Analysis"}
  ];

  document.addEventListener("DOMContentLoaded", function() {
    for (let i = 0; i < 50000; i++) {
      let d = (data[i] = {});

      d["id"] = "id_" + i;
      d["num"] = i;
      d["title"] = "Task " + i;
      d["duration"] = "5 days";
      d["start"] = "01/01/2009";
      d["finish"] = "01/05/2009";
      d["percentComplete"] = Math.round(Math.random() * 100);
      d["effortDriven"] = (i % 5 == 0);
    }

    dataView = new Slick.Data.DataView();
    grid = new Slick.Grid("#myGrid", dataView, columns, options);
    // Expose the instance for browser/Cypress characterization tests.
    window.grid = grid;
    columnpicker = new Slick.Controls.ColumnPicker(columns, grid, options);
    columnpicker.onColumnsChanged.subscribe(function () {
      CreateAddlHeaderRow();
    });
    gridMenuControl = new Slick.Controls.GridMenu(columns, grid, options);
    gridMenuControl.onColumnsChanged.subscribe(function () {
      CreateAddlHeaderRow();
    });

    dataView.onRowCountChanged.subscribe(function (e, args) {
      grid.updateRowCount();
      grid.render();
    });

    dataView.onRowsChanged.subscribe(function (e, args) {
      grid.invalidateRows(args.rows);
      grid.render();
    });

    grid.init();

    // onColumnsResized fires when the drag ends. Use onColumnsDrag as well so
    // the group headers follow the live column width while dragging.
    grid.onColumnsDrag.subscribe(function (e, args) {
      CreateAddlHeaderRow();
    });

    grid.onScroll.subscribe(function (e, args) {
      syncPinnedGroupHeaders(args.scrollLeft);
    });

    grid.onColumnsResized.subscribe(function (e, args) {
      CreateAddlHeaderRow();
    });

    grid.onColumnsReordered.subscribe(function (e, args) {
      CreateAddlHeaderRow();
    });
    grid.onAfterUpdateColumns.subscribe(function (e, args) {
      CreateAddlHeaderRow();
    });

    // subscribe to Grid Menu event(s)
    gridMenuControl.onCommand.subscribe(function(e, args) {
      if(args.command === "clear-pinned-columns") {
        setPinnedColumns(-1);
      }
    });

    // Initialise data
    dataView.beginUpdate();
    dataView.setItems(data);
    dataView.endUpdate();

    CreateAddlHeaderRow();
  });
</script>
</body>
</html>
