<!doctype html>
<!--
  TEMPORARY repro page for the footer-lifecycle bugs (triage Q5, Q19, Q27).
  DO NOT MERGE — drives the repro cypress test and lets a human see the fixes;
  delete at merge. Permanent test: cypress/e2e/quirk-footer-lifecycle.cy.ts.

  Q5  getViewportHeight crashes when showFooterRow is set without createFooterRow.
  Q27 getFooterRow() throws (non-frozen) instead of returning undefined when there is no footer.
  Q19 createColumnHeaders duplicated the footer create/destroy that createColumnFooter
      already does, so onFooterRowCellRendered fired twice per column.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SlickGrid quirk repro: footer lifecycle (Q5/Q19/Q27)</title>
  <link rel="stylesheet" href="../dist/styles/css/example-demo.css" type="text/css"/>
  <link rel="stylesheet" href="../dist/styles/css/slick-alpine-theme.css" type="text/css"/>
</head>
<body>
<h2>Footer lifecycle (TEMPORARY repro, do not merge)</h2>
<div style="width:700px;">
  <h3>Grid A — createFooterRow:false, showFooterRow:false (Q27 target)</h3>
  <div id="gridA" style="width:100%;height:150px;"></div>
  <h3>Grid B — createFooterRow:false, showFooterRow:true (Q5 target)</h3>
  <div id="gridB" style="width:100%;height:150px;"></div>
  <h3>Grid C — createFooterRow:true, showFooterRow:true (Q19 target)</h3>
  <div id="gridC" style="width:100%;height:150px;"></div>
  <button onclick="runChecks()">Run footer-lifecycle self-checks</button>
  <div id="checkResults" style="white-space:pre; font-family:monospace; font-size:12px; margin-top:8px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs/Sortable.min.js"></script>
<script src="sortable-cdn-fallback.js"></script>

<script src="../dist/browser/slick.core.js"></script>
<script src="../dist/browser/slick.interactions.js"></script>
<script src="../dist/browser/slick.grid.js"></script>

<script>
  var columns = [];
  for (var c = 0; c < 6; c++) { columns.push({ id: 'c' + c, name: 'Col ' + c, field: 'c' + c, width: 100 }); }
  var data = [];
  for (var r = 0; r < 20; r++) { var row = {}; for (var k = 0; k < 6; k++) { row['c' + k] = 'r' + r + 'c' + k; } data.push(row); }
  var COLCOUNT = columns.length;
  var base = { enableCellNavigation: true, enableColumnReorder: false };
  function cols() { return columns.map(function (x) { return Object.assign({}, x); }); }

  // Grid A: no footer at all — for the getFooterRow() contract (Q27)
  var gridA = new Slick.Grid('#gridA', data, cols(), Object.assign({}, base));

  // Grid B: showFooterRow WITHOUT createFooterRow — construction must not throw (Q5)
  var gridB, gridBError = null;
  try {
    gridB = new Slick.Grid('#gridB', data, cols(), Object.assign({ showFooterRow: true }, base));
  } catch (e) { gridBError = (e && e.message) || String(e); }

  // Grid C: full footer — count onFooterRowCellRendered fires per setColumns (Q19)
  var gridC = new Slick.Grid('#gridC', data, cols(), Object.assign({ createFooterRow: true, showFooterRow: true }, base));
  var footerRenderCount = 0;
  gridC.onFooterRowCellRendered.subscribe(function () { footerRenderCount++; });

  window.gridA = gridA; window.gridB = gridB; window.gridC = gridC;

  window.runChecks = function runChecks() {
    var out = [], pass = true;
    function check(label, ok, detail) {
      out.push((ok ? 'PASS ' : 'FAIL ') + label + (detail ? '  [' + detail + ']' : ''));
      if (!ok) { pass = false; }
    }

    // Q5 — grid with showFooterRow but no createFooterRow must construct without throwing
    check('Q5: showFooterRow without createFooterRow does not crash getViewportHeight',
      gridBError === null && !!gridB, gridBError ? ('threw: ' + gridBError) : 'constructed');

    // Q27 — getFooterRow() with no footer returns undefined (does not throw)
    var q27ok, q27detail;
    try { var fr = gridA.getFooterRow(); q27ok = (fr === undefined); q27detail = 'returned ' + fr; }
    catch (e) { q27ok = false; q27detail = 'threw: ' + ((e && e.message) || e); }
    check('Q27: getFooterRow() without createFooterRow returns undefined (no throw)', q27ok, q27detail);

    // Q19 — onFooterRowCellRendered fires exactly once per column on setColumns (not twice)
    footerRenderCount = 0;
    gridC.setColumns(gridC.getColumns());
    check('Q19: onFooterRowCellRendered fires once per column on setColumns',
      footerRenderCount === COLCOUNT, 'fired=' + footerRenderCount + ' expected=' + COLCOUNT);

    out.push(pass ? '\nALL CHECKS PASSED' : '\nCHECKS FAILED');
    document.getElementById('checkResults').textContent = out.join('\n');
    return pass;
  };
</script>
</body>
</html>
